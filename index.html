<style>
/* Layout: una columna tipo app de apuestas; índice arriba, parlays sugeridos, simulador, boleto de la imagen, ambos marcan, consejos y una tarjeta por partido */
:root{
  --bg:#eaeef2;--surface:#fff;--ink:#122130;--muted:#5a6a7a;--line:#d4dbe2;--soft:#f3f6f9;
  --accent:#2453c4;--win:#18804a;--win-bg:#e3f3ea;--lose:#c23434;--lose-bg:#fbe7e7;--pend:#8592a0;--away:#9a7b1c;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1520;--surface:#13202e;--ink:#e6ecf2;--muted:#8c9eb0;--line:#22334a;--soft:#182839;
  --accent:#7b9dff;--win:#3cc27c;--win-bg:#123326;--lose:#ff6f6f;--lose-bg:#3a1a1e;--pend:#6c7d8f;--away:#d9b44a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1520;--surface:#13202e;--ink:#e6ecf2;--muted:#8c9eb0;--line:#22334a;--soft:#182839;
  --accent:#7b9dff;--win:#3cc27c;--win-bg:#123326;--lose:#ff6f6f;--lose-bg:#3a1a1e;--pend:#6c7d8f;--away:#d9b44a;color-scheme:dark}
html{scroll-padding-top:12px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
#app{max-width:660px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px;display:flex;flex-direction:column;gap:14px}
h1{font:700 32px/1.05 var(--display);margin:0;text-wrap:balance}
h2{font:700 22px/1.1 var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
h3{font:700 18px/1.15 var(--display);margin:0}
p{margin:0}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chip{font:700 13px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:999px;white-space:nowrap}
.chip.p{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.chip.w{background:var(--win-bg);color:var(--win)}.chip.l{background:var(--lose-bg);color:var(--lose)}
.toc{display:flex;gap:6px;flex-wrap:wrap}
.toc a{font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px}
.toc a:focus-visible,.btn:focus-visible,.link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted)}
.note b{color:var(--ink)}
.btn{font:600 15px var(--body);border:0;border-radius:10px;padding:11px 14px;background:var(--accent);color:#fff;cursor:pointer}
.btn.sec{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.link{border:0;background:none;color:var(--accent);font:600 13px var(--body);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpis div{background:var(--soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpis b{font:700 26px/1.05 var(--display);font-variant-numeric:tabular-nums}
.kpis small{color:var(--muted);font-size:12px}
.kpis .bad b{color:var(--lose)}
/* parlays */
.parlay{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.parlay.w{border-color:color-mix(in srgb,var(--win) 60%,var(--line))}.parlay.l{border-color:color-mix(in srgb,var(--lose) 60%,var(--line))}
.ph{padding:12px 14px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.pnums{display:flex;gap:16px;flex-wrap:wrap;align-items:baseline}
.pnums b{font:700 24px/1 var(--display);font-variant-numeric:tabular-nums}
.pnums span{font-size:12px;color:var(--muted)}
.leg{width:100%;display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;color:inherit;font:inherit;padding:9px 14px;cursor:pointer}
.leg:first-of-type{border-top:0}
.leg:focus-visible,.sel:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--pend);display:grid;place-items:center;font-weight:700;font-size:13px;line-height:1;color:transparent}
.w>.dot,.leg.w .dot,.sel.w .dot{background:var(--win);border-color:var(--win);color:#fff}
.leg.l .dot,.sel.l .dot{background:var(--lose);border-color:var(--lose);color:#fff}
.lt{display:flex;flex-direction:column;min-width:0}.lt span{font-size:12px;color:var(--muted)}.lt b{font-weight:600}
.lp{text-align:right;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-variant-numeric:tabular-nums}
.lp em{font-style:normal;color:var(--ink);font-weight:600;font-size:14px}
.tag{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}.tag.man{color:var(--accent)}
/* simulador */
.simlist{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.simrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 12px;border-top:1px solid var(--line);font-size:14px}
.simrow:first-child{border-top:0}
.simrow b{font:700 18px/1 var(--display);font-variant-numeric:tabular-nums}
.simrow small{grid-column:1/-1;color:var(--muted);font-size:12px}
.hits{display:flex;flex-direction:column;gap:6px}
.hit{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px;align-items:center}
.meter{grid-column:1/-1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;background:var(--accent)}
.hit b{font-variant-numeric:tabular-nums}
.ok{color:var(--win);font-weight:600}.no{color:var(--lose);font-weight:600}
/* tablas */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.yes{color:var(--win);font-weight:600}.mid{color:var(--muted);font-weight:600}.nob{color:var(--lose);font-weight:600}
/* ranking */
.rank{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.rank li{display:grid;grid-template-columns:1fr auto;gap:3px 8px;font-size:14px;align-items:center}
.rank b{font-variant-numeric:tabular-nums}
.rank small{grid-column:1/-1;color:var(--muted);font-size:12px}
ol.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
ol.tips li b{font-weight:600}
/* partidos */
.match{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.match.l{border-color:color-mix(in srgb,var(--lose) 55%,var(--line))}.match.w{border-color:color-mix(in srgb,var(--win) 55%,var(--line))}
.mh{padding:12px 14px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.teams{font-weight:600;min-width:0}
.num{font:700 15px var(--display);color:var(--muted);margin-right:6px}
.score{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.sc{font:700 22px/1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.live{color:var(--lose);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.08em}.live.ft{color:var(--muted)}
.sel{width:100%;display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:inherit;font:inherit;padding:10px 14px;cursor:pointer}
.an{padding:12px 14px;display:flex;flex-direction:column;gap:12px;background:var(--soft)}
.x3{display:grid;grid-template-columns:92px 1fr;gap:6px 10px;align-items:center;font-size:13px}
.x3 .lb{color:var(--muted)}
.stack{display:flex;height:18px;border-radius:4px;overflow:hidden;font:600 11px/18px var(--body);color:#fff;font-variant-numeric:tabular-nums}
.stack span{display:block;text-align:center;overflow:hidden;white-space:nowrap}
.stack .h{background:var(--accent)}.stack .d{background:var(--pend)}.stack .a{background:var(--away)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.stats b{font:700 18px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stats small{font-size:12px;color:var(--muted)}
.facts{margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.tops{display:flex;gap:6px;flex-wrap:wrap}
.tops span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:13px;font-variant-numeric:tabular-nums}
.tops span b{font-family:var(--display);font-size:15px}
.src{font-size:12px;color:var(--muted)}
.warn{font-size:13px;color:var(--lose);font-weight:500}
@media (max-width:420px){.x3{grid-template-columns:78px 1fr}.kpis b{font-size:22px}}
@media (prefers-reduced-motion:no-preference){.meter i{transition:width .4s}}
</style>

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function norm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ø/g,'o').toLowerCase();}
function pct(x,d){var f=Math.pow(10,d==null?1:d);return (Math.round(x*f)/f).toLocaleString('es-HN')+'%';}
function num(x,d){return Number(x).toLocaleString('es-HN',{minimumFractionDigits:d||0,maximumFractionDigits:d||0});}
function hn(iso){return new Date(iso).toLocaleString('es-HN',{weekday:'short',hour:'numeric',minute:'2-digit',timeZone:'America/Tegucigalpa'});}
function bigN(x){var n=1/x;if(n>=1e15)return num(Math.round(n/1e15))+' mil billones';if(n>=1e12)return num(Math.round(n/1e12))+' billones';if(n>=1e6)return num(Math.round(n/1e6))+' millones';return num(Math.round(n));}

/* ---------- reglas: sirven para el marcador en vivo y para la simulación ---------- */
function evalRule(r,m){
  if(!m||m.st==='pre') return {s:'p',t:'no ha empezado'};
  var fin=m.st==='ft', tot=m.h+m.a;
  function ou(val,unit){
    if(val==null) return {s:'p',t:'sin dato'};
    var t=val+' '+unit;
    if(r.o==='over'){if(val>r.n)return{s:'w',t:t};return{s:fin?'l':'p',t:t};}
    if(val>r.n)return{s:'l',t:t};return{s:fin?'w':'p',t:t};
  }
  if(r.t==='goals') return ou(tot,'goles');
  if(r.t==='corners') return ou(m.c,'córners');
  if(r.t==='cards') return ou(m.k,'tarjetas');
  if(r.t==='offs') return ou(m.o,'fueras de juego');
  if(r.t==='btts'){var both=m.h>0&&m.a>0;
    if(r.v==='yes'){if(both)return{s:'w',t:'marcaron los dos'};return{s:fin?'l':'p',t:'va '+m.h+'-'+m.a};}
    if(both)return{s:'l',t:'marcaron los dos'};return{s:fin?'w':'p',t:'va '+m.h+'-'+m.a};}
  if(r.t==='1x2'||r.t==='dc'){var res=m.h>m.a?'1':m.h<m.a?'2':'X',ok=r.v.indexOf(res)>=0;
    return{s:fin?(ok?'w':'l'):'p',t:'va '+m.h+'-'+m.a+(fin?'':ok?' · cumpliendo':' · fallando')};}
  if(r.t==='cs'){var p=r.v;
    if(m.h>p[0]||m.a>p[1])return{s:'l',t:'va '+m.h+'-'+m.a+' · ya no se da'};
    if(fin)return(m.h===p[0]&&m.a===p[1])?{s:'w',t:'¡exacto!'}:{s:'l',t:'terminó '+m.h+'-'+m.a};
    var need=(p[0]-m.h)+(p[1]-m.a);return{s:'p',t:'va '+m.h+'-'+m.a+(need?' · faltan '+need:' · así debe terminar')};}
  return {s:'p',t:''};
}
function csRule(r){return {t:'cs',v:r.pick.split('-').map(Number)};}
function state(id,rule,m){var a=evalRule(rule,m),o=OV[id];return{s:o||a.s,t:a.t,man:!!o};}
function agg(states){var w=0,l=0;states.forEach(function(s){if(s==='w')w++;if(s==='l')l++;});return l?'l':w===states.length?'w':'p';}

/* ---------- simulador (mismo modelo que el cálculo) ---------- */
function rpois(l){var L=Math.exp(-l),k=0,p=1;do{k++;p*=Math.random();}while(p>L);return k-1;}
function rgamma(a){if(a<1){return rgamma(a+1)*Math.pow(Math.random(),1/a);}var d=a-1/3,c=1/Math.sqrt(9*d);for(;;){var x,v;do{var u1=Math.random(),u2=Math.random();x=Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2);v=1+c*x;}while(v<=0);v=v*v*v;var u=Math.random();if(u<1-0.0331*x*x*x*x)return d*v;if(Math.log(u)<0.5*x*x+d*(1-v+Math.log(v)))return d*v;}}
function rnb(mu,ratio){var r=mu/(ratio-1);return rpois(rgamma(r)*mu/r);}
function simMatch(r){return{h:rpois(r.lh),a:rpois(r.la),c:rnb(r.corners,1.5),k:rnb(r.cards,1.4),o:rnb(r.offs,1.5),st:'ft'};}
function simNight(){var m={};D.rows.forEach(function(r){m[r.n]=simMatch(r);});return m;}
function parlayHit(p,night){return p.legs.every(function(l){return evalRule(l.rule,night[l.n]).s==='w';});}
function imgHit(night){return D.rows.every(function(r){return evalRule(csRule(r),night[r.n]).s==='w';});}
function runMany(n){var hits={},img=0,best=0;D.parlays.forEach(function(p){hits[p.id]=0;});
  for(var i=0;i<n;i++){var nt=simNight();D.parlays.forEach(function(p){if(parlayHit(p,nt))hits[p.id]++;});if(imgHit(nt))img++;
    var c=D.rows.filter(function(r){return evalRule(csRule(r),nt[r.n]).s==='w';}).length;if(c>best)best=c;}
  return{n:n,hits:hits,img:img,best:best};}

function stack(v){return '<div class="stack" role="img" aria-label="Local '+pct(v[0])+', empate '+pct(v[1])+', visita '+pct(v[2])+'"><span class="h" style="width:'+v[0]+'%">'+Math.round(v[0])+'%</span><span class="d" style="width:'+v[1]+'%">'+Math.round(v[1])+'%</span><span class="a" style="width:'+v[2]+'%">'+Math.round(v[2])+'%</span></div>';}
function legBtn(id,title,sub,p,st){var ico=st.s==='w'?'✓':st.s==='l'?'✕':'';

  /* viaje al futuro */
  h+='<section class="card" id="futuro"><h2>Viaje al futuro</h2><p class="muted">Simula la noche del viernes. Cada vez sale distinto, igual que en la vida real. Así ves con qué frecuencia gana cada parlay.</p>';
  h+='<div class="btns"><button class="btn" id="sim1" type="button">Simular una noche</button><button class="btn sec" id="simN" type="button">Simular 10,000 noches</button></div>';
  if(NIGHT){
    h+='<div class="simlist">';
    D.rows.forEach(function(r){var m=NIGHT[r.n],ok=evalRule(csRule(r),m).s==='w';
      h+='<div class="simrow"><span>'+esc(r.home)+' vs '+esc(r.away)+'</span><b>'+m.h+'-'+m.a+'</b><small>'+m.c+' córners · '+m.k+' tarjetas · '+m.o+' fueras de juego · tu marcador '+r.pick+': '+(ok?'<span class="ok">acertado</span>':'<span class="no">fallado</span>')+'</small></div>';});
    h+='</div><div class="hits">';
    D.parlays.forEach(function(p){var ok=parlayHit(p,NIGHT);h+='<div class="hit"><span>'+esc(p.name)+'</span><span class="'+(ok?'ok':'no')+'">'+(ok?'Ganó':'Perdió')+'</span></div>';});
    var c=D.rows.filter(function(r){return evalRule(csRule(r),NIGHT[r.n]).s==='w';}).length;
    h+='<div class="hit"><span>Boleto de la imagen (14 exactos)</span><span class="'+(imgHit(NIGHT)?'ok':'no')+'">'+c+' de 14 acertados</span></div></div>';
  }
  if(MANY){
    h+='<h3>Resultado de '+num(MANY.n)+' noches simuladas</h3><div class="hits">';
    D.parlays.forEach(function(p){var r=MANY.hits[p.id]/MANY.n*100;h+='<div class="hit"><span>'+esc(p.name)+'</span><b>'+num(MANY.hits[p.id])+' veces ('+pct(r)+')</b><span class="meter"><i style="width:'+r+'%"></i></span></div>';});
    h+='<div class="hit"><span>Boleto de la imagen</span><b>'+num(MANY.img)+' veces</b><span class="meter"><i style="width:0%"></i></span></div></div>';
    h+='<p class="muted">En la mejor de esas '+num(MANY.n)+' noches se acertaron '+MANY.best+' de los 14 marcadores de la imagen.</p>';
  }
  h+='</section>';

  /* boleto de la imagen */
  var rk=D.rows.slice().sort(function(a,b){return b.side_p-a.side_p;});
  var iw=imgStates.filter(function(s){return s==='w';}).length,il=imgStates.filter(function(s){return s==='l';}).length;
  h+='<section class="card" id="boleto"><div class="row"><h2>Tu boleto: 14 marcadores exactos</h2><span class="chip '+imgSt+'">'+{p:'En juego',w:'¡Ganado!',l:'Perdido'}[imgSt]+'</span></div>';
  h+='<div class="kpis"><div class="bad"><span class="lbl">Acertar los 14 marcadores</span><b>1 en '+bigN(D.combo_exact)+'</b><small>En '+num(D.N)+' simulaciones salió '+D.img_hits+' veces</small></div><div><span class="lbl">Acertar solo quién gana en los 14</span><b>1 en '+num(Math.round(1/D.combo_side))+'</b><small>Ni así es una apuesta razonable</small></div></div>';
  h+='<p class="muted">'+iw+' acertados · '+(14-iw-il)+' pendientes · '+il+' fallados. Probabilidad de cada pronóstico de la imagen:</p><ul class="rank">';
  rk.forEach(function(r){var who=r.side===0?r.home:r.side===2?r.away:'Empate';
    h+='<li><span>'+esc(r.home)+' <b>'+r.pick+'</b> '+esc(r.away)+'</span><b>'+pct(r.exact)+'</b><small>Que gane '+esc(who)+': '+pct(r.side_p)+' · marcador que más se repite: '+r.top[0].s+' ('+pct(r.top[0].p)+')</small></li>';});
  h+='</ul><p class="warn">Errores en la imagen: el #10 es contra Bali United (no Isenmulang Kalteng), el escudo del #12 no es del Newroz y falta el partido #11.</p></section>';

  /* ambos marcan */
  var bt=D.rows.slice().sort(function(a,b){return b.btts_fin-a.btts_fin;});
  h+='<section class="card" id="ambos"><h2>¿Ambos equipos marcan?</h2><p class="muted">Fuentes: probabilidades publicadas o cuotas sin margen. Simulación: mi modelo. Veredicto: el promedio de los dos.</p><div class="tbl"><table><thead><tr><th>Partido</th><th class="n">Fuentes</th><th class="n">Simulación</th><th class="n">Veredicto</th></tr></thead><tbody>';
  bt.forEach(function(r){h+='<tr><td>'+esc(r.home)+' vs '+esc(r.away)+'</td><td class="n">'+(r.btts_src==null?'–':pct(r.btts_src,0))+'</td><td class="n">'+pct(r.mkts.BY.p,0)+'</td><td class="n '+bttsClass(r.btts_fin)+'">'+bttsWord(r.btts_fin)+' '+pct(r.btts_fin,0)+'</td></tr>';});
  h+='</tbody></table></div></section>';

  /* consejos */
  h+='<section class="card" id="consejos"><h2>Consejos para tener más chance</h2><ol class="tips">';
  h+='<li><b>No juegues marcadores exactos en parlay.</b> Aunque aciertes quién gana, basta un gol de más para perder. Si igual quieres el boleto de la imagen, ponle poco dinero, como si fuera lotería.</li>';
  h+='<li><b>Usa menos partidos.</b> 14 selecciones de 85% cada una ganan juntas solo 1 de cada 10 veces. Con 3 o 4 la historia cambia.</li>';
  h+='<li><b>Compara con la cuota justa.</b> Si la casa paga menos que la cuota justa de esta página, a largo plazo pierdes dinero aunque aciertes seguido.</li>';
  h+='<li><b>Evita los partidos parejos</b> (Burnley–Wolves, Frosinone–Sassuolo, Le Mans–Toulouse). Ahí cualquier resultado es casi lanzar una moneda.</li>';
  h+='<li><b>Revisa las alineaciones una hora antes.</b> Si un favorito sale con suplentes o hay una baja importante, sus probabilidades bajan.</li>';
  h+='<li><b>Cuidado con las tarjetas:</b> en algunas casas la roja cuenta como 2. Lee la regla del mercado antes de apostar.</li>';
  h+='<li><b>Apuesta solo lo que no te afecte perder</b> y no subas la apuesta para recuperar. La casa siempre se queda con un margen.</li></ol></section>';

  /* método */
  h+='<section class="card"><h2>Cómo se calculó</h2><p class="muted"><b>Filtro 1 (fuentes):</b> promedio de lo publicado por Sportradar, Fox Sports, Forebet, KickOff, Foresportia, FotMob y cuotas de casas de apuestas sin margen. <b>Filtro 2 (modelo propio):</b> goles esperados de cada equipo según promedio de goles, xG, forma de los últimos 5 partidos, historial y localía, con un modelo de Poisson. El <b>veredicto</b> es el promedio de los dos y con él se simulan los partidos. Córners y tarjetas usan los promedios de Forebet cuando existen y, si no, el típico de cada liga. Los fueras de juego son una estimación: ninguna fuente los publica por partido.</p>';
  h+='<div class="legend"><span><i style="background:var(--accent)"></i>Local</span><span><i style="background:var(--pend)"></i>Empate</span><span><i style="background:var(--away)"></i>Visita</span></div></section>';

  /* partidos */
  h+='<h2 id="partidos">Partido por partido</h2>';
  D.rows.forEach(function(r){
    var m=LIVE[r.n], st=state('img-'+r.n,csRule(r),m), ico=st.s==='w'?'✓':st.s==='l'?'✕':'';
    var live=!m||m.st==='pre'?'<span class="live ft">'+esc(hn(r.ko))+' (Honduras, aprox.)</span>':m.st==='ft'?'<span class="live ft">Final</span>':m.st==='ht'?'<span class="live">Medio tiempo</span>':'<span class="live">En vivo '+esc(m.clock||'')+'</span>';
    h+='<article class="match '+st.s+'" id="m'+r.n+'"><div class="mh"><div class="row"><span class="teams"><span class="num">'+String(r.n).padStart(2,'0')+'</span>'+esc(r.home)+' vs '+esc(r.away)+'</span><span class="lbl">'+esc(r.league)+'</span></div>';
    h+='<div class="score"><span class="sc">'+(m&&m.st!=='pre'?m.h+' – '+m.a:'– : –')+'</span>'+live;
    if(m&&m.st!=='pre')h+='<span>'+(m.c==null?'–':m.c)+' córners · '+(m.k==null?'–':m.k)+' tarjetas · '+(m.o==null?'–':m.o)+' fueras de juego</span>';
    h+='</div></div>';
    h+='<button class="sel '+st.s+'" data-ov="img-'+r.n+'" id="b-img-'+r.n+'" type="button"><span class="dot" aria-hidden="true">'+ico+'</span><span class="lt"><span>Marcador exacto de la imagen</span><b>'+esc(r.home)+' '+r.pick+' '+esc(r.away)+'</b></span><span class="lp"><em>'+pct(r.exact)+'</em><span>'+esc(st.t)+(st.man?' · manual':'')+'</span></span></button>';
    h+='<div class="an"><div class="x3"><span class="lb">Filtro 1</span>'+stack(r.f1)+'<span class="lb">Filtro 2</span>'+stack(r.f2)+'<span class="lb"><b>Veredicto</b></span>'+stack(r.fin)+'</div>';
    h+='<div><div class="lbl">Marcadores que más salen en la simulación</div><div class="tops">'+r.top.slice(0,4).map(function(t){return '<span><b>'+t.s+'</b> '+pct(t.p)+'</span>';}).join('')+'</div></div>';
    var M=r.mkts;
    h+='<div class="stats">';
    h+='<div><span class="lbl">Ambos marcan</span><b class="'+bttsClass(r.btts_fin)+'">'+bttsWord(r.btts_fin)+' '+pct(r.btts_fin,0)+'</b><small>Fuentes '+(r.btts_src==null?'–':pct(r.btts_src,0))+' · simulación '+pct(M.BY.p,0)+'</small></div>';
    h+='<div><span class="lbl">Goles</span><b>'+num(r.lh+r.la,1)+' esperados</b><small>Más de 1.5: '+pct(M['O1.5'].p,0)+' · más de 2.5: '+pct(M['O2.5'].p,0)+' · menos de 3.5: '+pct(M['U3.5'].p,0)+'</small></div>';
    h+='<div><span class="lbl">Doble oportunidad</span><b>1X '+pct(M['1X'].p,0)+'</b><small>X2: '+pct(M.X2.p,0)+' · 12: '+pct(M['12'].p,0)+'</small></div>';
    h+='<div><span class="lbl">Córners (~'+num(r.corners,1)+')</span><b>+7.5: '+pct(M['CO7.5'].p,0)+'</b><small>+8.5: '+pct(M['CO8.5'].p,0)+' · +9.5: '+pct(M['CO9.5'].p,0)+' · +10.5: '+pct(M['CO10.5'].p,0)+'</small></div>';
    h+='<div><span class="lbl">Tarjetas (~'+num(r.cards,1)+')</span><b>+2.5: '+pct(M['KO2.5'].p,0)+'</b><small>+1.5: '+pct(M['KO1.5'].p,0)+' · +3.5: '+pct(M['KO3.5'].p,0)+' · +4.5: '+pct(M['KO4.5'].p,0)+'</small></div>';
    h+='<div><span class="lbl">Fueras de juego (est. ~'+num(r.offs,1)+')</span><b>+2.5: '+pct(M['OO2.5'].p,0)+'</b><small>+3.5: '+pct(M['OO3.5'].p,0)+' · +4.5: '+pct(M['OO4.5'].p,0)+'</small></div>';
    h+='</div><div><div class="lbl">Datos de los partidos anteriores</div><ul class="facts">'+r.facts.map(function(f){return '<li>'+esc(f)+'</li>';}).join('')+'</ul></div>';
    h+='<p class="src">Fuentes del filtro 1: '+esc(r.sources.join(', '))+'.'+(r.note?' '+esc(r.note):'')+'</p></div></article>';
  });
  h+='<p class="muted">Toca cualquier selección para marcarla a mano: ganada → perdida → automática. Las marcas se guardan en este dispositivo.</p>';
  document.getElementById('app').innerHTML=h;
}

/* ---------- marcadores en vivo (ESPN) ---------- */
async function getJSON(u){var r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.json();}
function stat(t,names){var a=(t&&t.statistics)||[];for(var i=0;i<names.length;i++){var x=a.find(function(s){return s.name===names[i];});if(x){var v=Number(x.displayValue!=null?x.displayValue:x.value);if(!isNaN(v))return v;}}return null;}
function tt(c){var t=(c&&c.team)||{};return norm([t.displayName,t.name,t.shortDisplayName,t.location,t.abbreviation].join(' '));}
async function refresh(){
  var lg={};D.rows.forEach(function(r){(lg[r.espn]=lg[r.espn]||[]).push(r);});var ok=0;
  await Promise.all(Object.keys(lg).map(async function(code){
    var base='https://site.api.espn.com/apis/site/v2/sports/soccer/'+code,sb;
    try{sb=await getJSON(base+'/scoreboard?dates='+D.date);ok++;}catch(e){return;}
    var evs=sb.events||[];
    await Promise.all(lg[code].map(async function(r){
      var ev=evs.find(function(e){var cs=(e.competitions&&e.competitions[0]&&e.competitions[0].competitors)||[];
        return cs.some(function(c){return r.qh.some(function(q){return tt(c).indexOf(q)>=0;});})&&cs.some(function(c){return r.qa.some(function(q){return tt(c).indexOf(q)>=0;});});});
      if(!ev)return;
      var comp=ev.competitions[0],hm=comp.competitors.find(function(c){return c.homeAway==='home';})||comp.competitors[0],aw=comp.competitors.find(function(c){return c.homeAway==='away';})||comp.competitors[1];
      var ty=(ev.status&&ev.status.type)||{},st=ty.state==='post'?'ft':ty.state==='in'?(/HALFTIME|HALF_TIME/i.test(ty.name||'')?'ht':'live'):'pre';
      var hh=r.qh.some(function(q){return tt(hm).indexOf(q)>=0;}),sh=Number(hm.score)||0,sa=Number(aw.score)||0;
      var m={h:hh?sh:sa,a:hh?sa:sh,st:st,clock:(ev.status&&ev.status.displayClock)||'',c:null,k:null,o:null};
      if(st!=='pre'){try{var su=await getJSON(base+'/summary?event='+ev.id),c=0,k=0,o=0,hc=0,hk=0,ho=0;
        ((su.boxscore&&su.boxscore.teams)||[]).forEach(function(t){var x=stat(t,['wonCorners','cornerKicks']);if(x!=null){c+=x;hc=1;}var y=stat(t,['yellowCards']),rd=stat(t,['redCards']);if(y!=null||rd!=null){k+=(y||0)+(rd||0);hk=1;}var of=stat(t,['offsides']);if(of!=null){o+=of;ho=1;}});
        if(hc)m.c=c;if(hk)m.k=k;if(ho)m.o=o;}catch(e){}}
      LIVE[r.n]=m;
    }));
  }));
  SRC=ok?'Marcadores en vivo de ESPN · '+new Date().toLocaleTimeString('es-HN',{hour:'numeric',minute:'2-digit'}):(IS_GH?'No se pudieron leer los marcadores. Reintentando…':'Análisis previo. Los marcadores en vivo funcionan en la página de GitHub.');
  render();
}

document.getElementById('app').addEventListener('click',function(e){
  if(e.target.closest('#refresh')){SRC='Actualizando…';render();refresh();return;}
  if(e.target.closest('#sim1')){NIGHT=simNight();render();var s=document.getElementById('futuro');if(s)s.scrollIntoView({block:'start'});return;}
  if(e.target.closest('#simN')){var b=e.target.closest('#simN');b.textContent='Simulando…';b.disabled=true;setTimeout(function(){MANY=runMany(10000);render();var s=document.getElementById('futuro');if(s)s.scrollIntoView({block:'start'});},30);return;}
  var t=e.target.closest('[data-ov]');if(!t)return;var id=t.dataset.ov,cur=OV[id];
  if(!cur)OV[id]='w';else if(cur==='w')OV[id]='l';else delete OV[id];
  try{localStorage.setItem(LSK,JSON.stringify(OV));}catch(er){}
  render();var nb=document.getElementById('b-'+id);if(nb)nb.focus();
});
SRC=IS_GH?'Cargando marcadores…':'Análisis previo. Los marcadores en vivo funcionan en la página de GitHub.';
render();
if(IS_GH){refresh();setInterval(refresh,60000);}
})();
