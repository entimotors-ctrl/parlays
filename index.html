  var h='<header class="card"><div class="row"><div><div class="lbl">Viernes 16 de octubre · 14 partidos</div><h1>Parlay de marcadores exactos</h1></div><span class="chip '+st+'">'+{p:'En juego',w:'¡Ganado!',l:'Perdido'}[st]+'</span></div>';
  h+='<div class="odds"><div class="bad"><span class="lbl">Acertar los 14 marcadores</span><b>1 en '+bigN(D.combo_exact)+'</b><small>Prácticamente imposible</small></div>';
  h+='<div><span class="lbl">Acertar solo el ganador de los 14</span><b>1 en '+bigN(D.combo_side)+'</b><small>'+tiny(D.combo_side)+' de probabilidad</small></div></div>';
  h+='<div class="bar" aria-hidden="true"><i class="w" style="width:'+(w/tot*100)+'%"></i><i class="l" style="width:'+(l/tot*100)+'%"></i></div>';
  h+='<div class="counts"><span><b>'+w+'</b> acertados</span><span><b>'+(tot-w-l)+'</b> pendientes</span><span><b>'+l+'</b> fallados</span></div>';
  h+='<div class="row muted"><span>'+esc(SRC)+'</span>'+(IS_GH?'<button class="link" id="refresh" type="button">Actualizar ahora</button>':'')+'</div></header>';

  var rk=rows.slice().sort(function(a,b){return b.side_p-a.side_p;});
  h+='<section class="card"><h2>¿Qué tan probable es cada pronóstico?</h2><p class="muted">Probabilidad de que gane quien dice la imagen (o empate). Debajo, la de que salga el marcador exacto.</p><ul class="rank">';
  rk.forEach(function(r){
    var who=r.side===0?r.home:r.side===2?r.away:'Empate';
    h+='<li><span>'+esc(who)+' <span class="muted">('+esc(r.home)+' '+r.pick+' '+esc(r.away)+')</span></span><b>'+pct(r.side_p)+'</b><span class="meter"><i style="width:'+r.side_p+'%"></i></span><span class="muted" style="grid-column:1/-1">Marcador exacto '+r.pick+': '+pct(r.exact)+' · el más probable es '+r.best+' ('+pct(r.best_p)+')</span></li>';
  });
  h+='</ul></section>';

  h+='<section class="card"><h2>Cómo se calculó</h2><p class="muted"><b>Filtro 1 (fuentes):</b> promedio de las probabilidades publicadas por Sportradar, Fox Sports, Forebet, KickOff, Foresportia, FotMob y cuotas de casas de apuestas sin margen. <b>Filtro 2 (modelo propio):</b> goles esperados de cada equipo según su promedio de goles, xG, forma de los últimos 5 partidos y localía, pasados por un modelo de Poisson. El <b>veredicto</b> es el promedio de los dos. Córners, tarjetas y fueras de juego usan los promedios de Forebet cuando existen y, si no, el promedio típico de cada liga; los fueras de juego son siempre una estimación, porque ninguna fuente los publica por partido.</p>';
  h+='<div class="legend"><span><i style="background:var(--accent)"></i>Local</span><span><i style="background:var(--pend)"></i>Empate</span><span><i style="background:var(--draw)"></i>Visita</span></div></section>';

  rows.forEach(function(r){
    var m=LIVE[r.n], ss=selState(r), ico=ss.s==='w'?'✓':ss.s==='l'?'✕':'';
    var live=!m||m.st==='pre'?'<span class="live ft">'+esc(hn(r.ko))+' (Honduras)</span>':m.st==='ft'?'<span class="live ft">Final</span>':m.st==='ht'?'<span class="live">Medio tiempo</span>':'<span class="live">En vivo '+esc(m.clock||'')+'</span>';
    h+='<article class="match '+ss.s+'"><div class="mh"><div class="row"><span class="teams"><span class="num">'+String(r.n).padStart(2,'0')+'</span>'+esc(r.home)+' vs '+esc(r.away)+'</span><span class="lbl">'+esc(r.league)+'</span></div>';
    h+='<div class="score"><span class="sc">'+(m&&m.st!=='pre'?m.h+' – '+m.a:'– : –')+'</span>'+live;
    if(m&&m.st!=='pre') h+='<span>'+(m.c==null?'–':m.c)+' córners · '+(m.k==null?'–':m.k)+' tarjetas · '+(m.o==null?'–':m.o)+' fueras de juego</span>';
    h+='</div></div>';
    h+='<button class="sel '+ss.s+'" id="sel-'+r.n+'" data-id="'+r.n+'" aria-label="Marcador exacto '+r.pick+'"><span class="dot" aria-hidden="true">'+ico+'</span><span class="st"><span>Marcador exacto</span><b>'+esc(r.home)+' '+r.pick+' '+esc(r.away)+'</b></span><span class="pr"><em>'+esc(ss.t)+'</em><span class="tag'+(ss.man?' man':'')+'">'+(ss.man?'manual':'auto')+'</span></span></button>';
    h+='<div class="an"><div class="x3"><span class="lb">Filtro 1</span>'+stack(r.f1)+'<span class="lb">Filtro 2</span>'+stack(r.f2)+'<span class="lb"><b>Veredicto</b></span>'+stack(r.fin)+'</div>';
    h+='<div class="stats">';
    h+='<div><span class="lbl">Marcador '+r.pick+'</span><b>'+pct(r.exact)+'</b><small>Más probable: '+r.best+' ('+pct(r.best_p)+')</small></div>';
    h+='<div><span class="lbl">Goles esperados</span><b>'+r.goals.toLocaleString('es-HN')+'</b><small>Más de 2.5: '+pct(r.o25)+' · Ambos marcan: '+pct(r.btts)+'</small></div>';
    h+='<div><span class="lbl">Córners</span><b>~'+r.corners.toLocaleString('es-HN')+'</b><small>Más de 8.5: '+r.c85+'% · Más de 9.5: '+r.c95+'%</small></div>';
    h+='<div><span class="lbl">Tarjetas</span><b>~'+r.cards.toLocaleString('es-HN')+'</b><small>Al menos 1: '+Math.round(r.yellow1)+'% · Más de 3.5: '+r.k35+'% · Más de 4.5: '+r.k45+'%</small></div>';
    h+='<div><span class="lbl">Fueras de juego (est.)</span><b>~'+r.offs.toLocaleString('es-HN')+'</b><small>Más de 3.5: '+r.o35+'% · Más de 4.5: '+r.o45+'%</small></div>';
    h+='<div><span class="lbl">Ganador de la imagen</span><b>'+pct(r.side_p)+'</b><small>'+(r.side===0?esc(r.home):r.side===2?esc(r.away):'Empate')+'</small></div>';
    h+='</div><p class="src">Fuentes del filtro 1: '+esc(r.sources.join(', '))+'.'+(r.note?' '+esc(r.note):'')+'</p></div></article>';
  });
  h+='<p class="muted">Toca un marcador para forzarlo a mano: acertado → fallado → automático. Las horas son aproximadas. Esto es un cálculo de probabilidades, no una garantía.</p>';
  document.getElementById('app').innerHTML=h;
}

async function getJSON(u){var r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.json();}
function stat(t,names){var a=(t&&t.statistics)||[];for(var i=0;i<names.length;i++){var x=a.find(function(s){return s.name===names[i];});if(x){var v=Number(x.displayValue!=null?x.displayValue:x.value);if(!isNaN(v))return v;}}return null;}
function tt(c){var t=(c&&c.team)||{};return norm([t.displayName,t.name,t.shortDisplayName,t.location,t.abbreviation].join(' '));}
async function refresh(){
  var leagues={}; D.rows.forEach(function(r){(leagues[r.espn]=leagues[r.espn]||[]).push(r);});
  var ok=0;
  await Promise.all(Object.keys(leagues).map(async function(lg){
    var base='https://site.api.espn.com/apis/site/v2/sports/soccer/'+lg;
    var sb; try{sb=await getJSON(base+'/scoreboard?dates='+D.date);ok++;}catch(e){return;}
    var evs=sb.events||[];
    await Promise.all(leagues[lg].map(async function(r){
      var ev=evs.find(function(e){var cs=(e.competitions&&e.competitions[0]&&e.competitions[0].competitors)||[];
        return cs.some(function(c){return r.qh.some(function(q){return tt(c).indexOf(q)>=0;});})&&cs.some(function(c){return r.qa.some(function(q){return tt(c).indexOf(q)>=0;});});});
      if(!ev) return;
      var comp=ev.competitions[0], hm=comp.competitors.find(function(c){return c.homeAway==='home';})||comp.competitors[0], aw=comp.competitors.find(function(c){return c.homeAway==='away';})||comp.competitors[1];
      var ty=(ev.status&&ev.status.type)||{}, st=ty.state==='post'?'ft':ty.state==='in'?(/HALFTIME|HALF_TIME/i.test(ty.name||'')?'ht':'live'):'pre';
      var homeIsHome=r.qh.some(function(q){return tt(hm).indexOf(q)>=0;});
      var sh=Number(hm.score)||0, sa=Number(aw.score)||0;
      var m={h:homeIsHome?sh:sa,a:homeIsHome?sa:sh,st:st,clock:(ev.status&&ev.status.displayClock)||'',c:null,k:null,o:null};
      if(st!=='pre'){try{var su=await getJSON(base+'/summary?event='+ev.id),c=0,k=0,o=0,hc=0,hk=0,ho=0;
        ((su.boxscore&&su.boxscore.teams)||[]).forEach(function(t){var x=stat(t,['wonCorners','cornerKicks']);if(x!=null){c+=x;hc=1;}var y=stat(t,['yellowCards']),rd=stat(t,['redCards']);if(y!=null||rd!=null){k+=(y||0)+(rd||0);hk=1;}var of=stat(t,['offsides']);if(of!=null){o+=of;ho=1;}});
        if(hc)m.c=c;if(hk)m.k=k;if(ho)m.o=o;}catch(e){}}
      LIVE[r.n]=m;
    }));
  }));
  SRC=ok?'Marcadores en vivo de ESPN · '+new Date().toLocaleTimeString('es-HN',{hour:'numeric',minute:'2-digit'}):(IS_GH?'No se pudieron leer los marcadores. Reintentando…':'Análisis previo. Los marcadores en vivo funcionan en la página de GitHub.');
  render();
}
document.getElementById('app').addEventListener('click',function(e){
  if(e.target.closest('#refresh')){SRC='Actualizando…';render();refresh();return;}
  var b=e.target.closest('[data-id]');if(!b)return;var id=b.dataset.id,cur=OV[id];
  if(!cur)OV[id]='w';else if(cur==='w')OV[id]='l';else delete OV[id];
  try{localStorage.setItem(LSK,JSON.stringify(OV));}catch(er){}
  render();var nb=document.getElementById('sel-'+id);if(nb)nb.focus();
});
SRC=IS_GH?'Cargando marcadores…':'Análisis previo. Los marcadores en vivo funcionan en la página de GitHub.';
render();
if(IS_GH){refresh();setInterval(refresh,60000);}
})();
</script>
