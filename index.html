<!doctype html>
<html lang="es">
<head>

<title>Boleto de 11 partidos</title>

<style>
/* Layout: una columna tipo boleto; resumen arriba, simulador y una tarjeta por selección */
:root{
  --bg:#eaeef2;--surface:#fff;--ink:#122130;--muted:#5a6a7a;--line:#d4dbe2;--soft:#f3f6f9;
  --accent:#2453c4;--win:#18804a;--win-bg:#e3f3ea;--lose:#c23434;--lose-bg:#fbe7e7;--pend:#8592a0;--away:#9a7b1c;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1520;--surface:#13202e;--ink:#e6ecf2;--muted:#8c9eb0;--line:#22334a;--soft:#182839;
  --accent:#7b9dff;--win:#3cc27c;--win-bg:#123326;--lose:#ff6f6f;--lose-bg:#3a1a1e;--pend:#6c7d8f;--away:#d9b44a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1520;--surface:#13202e;--ink:#e6ecf2;--muted:#8c9eb0;--line:#22334a;--soft:#182839;
  --accent:#7b9dff;--win:#3cc27c;--win-bg:#123326;--lose:#ff6f6f;--lose-bg:#3a1a1e;--pend:#6c7d8f;--away:#d9b44a;color-scheme:dark}
html{scroll-padding-top:12px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
#app{max-width:660px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px;display:flex;flex-direction:column;gap:14px}
h1{font:700 32px/1.05 var(--display);margin:0;text-wrap:balance}
h2{font:700 22px/1.1 var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
h3{font:700 18px/1.15 var(--display);margin:0}
p{margin:0}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chip{font:700 13px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:999px;white-space:nowrap}
.chip.p{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.chip.w{background:var(--win-bg);color:var(--win)}.chip.l{background:var(--lose-bg);color:var(--lose)}
.toc{display:flex;gap:6px;flex-wrap:wrap}
.toc a{font-size:13px;font-weight:600;color:var(--accent);text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 10px}
.toc a:focus-visible,.btn:focus-visible,.link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted)}
.note b{color:var(--ink)}
.btn{font:600 15px var(--body);border:0;border-radius:10px;padding:11px 14px;background:var(--accent);color:#fff;cursor:pointer}
.btn.sec{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.link{border:0;background:none;color:var(--accent);font:600 13px var(--body);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpis div{background:var(--soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpis b{font:700 26px/1.05 var(--display);font-variant-numeric:tabular-nums}
.kpis small{color:var(--muted);font-size:12px}
.kpis .bad b{color:var(--lose)}
/* parlays */
.parlay{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.parlay.w{border-color:color-mix(in srgb,var(--win) 60%,var(--line))}.parlay.l{border-color:color-mix(in srgb,var(--lose) 60%,var(--line))}
.ph{padding:12px 14px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.pnums{display:flex;gap:16px;flex-wrap:wrap;align-items:baseline}
.pnums b{font:700 24px/1 var(--display);font-variant-numeric:tabular-nums}
.pnums span{font-size:12px;color:var(--muted)}
.leg{width:100%;display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;color:inherit;font:inherit;padding:9px 14px;cursor:pointer}
.leg:first-of-type{border-top:0}
.leg:focus-visible,.sel:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--pend);display:grid;place-items:center;font-weight:700;font-size:13px;line-height:1;color:transparent}
.w>.dot,.leg.w .dot,.sel.w .dot{background:var(--win);border-color:var(--win);color:#fff}
.leg.l .dot,.sel.l .dot{background:var(--lose);border-color:var(--lose);color:#fff}
.lt{display:flex;flex-direction:column;min-width:0}.lt span{font-size:12px;color:var(--muted)}.lt b{font-weight:600}
.lp{text-align:right;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-variant-numeric:tabular-nums}

.tag{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}.tag.man{color:var(--accent)}
/* simulador */
.simlist{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.simrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 12px;border-top:1px solid var(--line);font-size:14px}
.simrow:first-child{border-top:0}
.simrow b{font:700 18px/1 var(--display);font-variant-numeric:tabular-nums}
.simrow small{grid-column:1/-1;color:var(--muted);font-size:12px}
.hits{display:flex;flex-direction:column;gap:6px}
.hit{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px;align-items:center}
.meter{grid-column:1/-1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;background:var(--accent)}
.hit b{font-variant-numeric:tabular-nums}
.ok{color:var(--win);font-weight:600}.no{color:var(--lose);font-weight:600}
/* tablas */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.yes{color:var(--win);font-weight:600}.mid{color:var(--muted);font-weight:600}.nob{color:var(--lose);font-weight:600}
/* ranking */
.rank{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.rank li{display:grid;grid-template-columns:1fr auto;gap:3px 8px;font-size:14px;align-items:center}
.rank b{font-variant-numeric:tabular-nums}
.rank small{grid-column:1/-1;color:var(--muted);font-size:12px}
ol.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
ol.tips li b{font-weight:600}
/* partidos */
.match{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.match.l{border-color:color-mix(in srgb,var(--lose) 55%,var(--line))}.match.w{border-color:color-mix(in srgb,var(--win) 55%,var(--line))}
.mh{padding:12px 14px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.teams{font-weight:600;min-width:0}
.num{font:700 15px var(--display);color:var(--muted);margin-right:6px}
.score{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.sc{font:700 22px/1 var(--display);color:var(--ink);font-variant-numeric:tabular-nums}
.live{color:var(--lose);font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.08em}.live.ft{color:var(--muted)}
.sel{width:100%;display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:inherit;font:inherit;padding:10px 14px;cursor:pointer}
.an{padding:12px 14px;display:flex;flex-direction:column;gap:12px;background:var(--soft)}
.x3{display:grid;grid-template-columns:92px 1fr;gap:6px 10px;align-items:center;font-size:13px}
.x3 .lb{color:var(--muted)}
.stack{display:flex;height:18px;border-radius:4px;overflow:hidden;font:600 11px/18px var(--body);color:#fff;font-variant-numeric:tabular-nums}
.stack span{display:block;text-align:center;overflow:hidden;white-space:nowrap}
.stack .h{background:var(--accent)}.stack .d{background:var(--pend)}.stack .a{background:var(--away)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.stats b{font:700 18px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stats small{font-size:12px;color:var(--muted)}
.facts{margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.tops{display:flex;gap:6px;flex-wrap:wrap}
.tops span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:13px;font-variant-numeric:tabular-nums}
.tops span b{font-family:var(--display);font-size:15px}
.src{font-size:12px;color:var(--muted)}
.warn{font-size:13px;color:var(--lose);font-weight:500}
@media (max-width:420px){.x3{grid-template-columns:78px 1fr}.kpis b{font-size:22px}}
@media (prefers-reduced-motion:no-preference){.meter i{transition:width .4s}}
.pa{font:700 11px/1 var(--body);border:1px solid var(--line);border-radius:4px;padding:2px 5px;margin-left:6px;color:var(--muted)}
.oddsv{font:700 20px/1 var(--display);font-variant-numeric:tabular-nums}
</style>
</head>

<script>
(function(){
var D=JSON.parse(document.getElementById('data').textContent);
var LIVE={},SRC='',OV={},PAHIT={},LSK='boleto-5532489265',IS_GH=/github\.io$/.test(location.hostname),NIGHT=null,MANY=null;
try{var S=JSON.parse(localStorage.getItem(LSK)||'{}')||{};OV=S.ov||{};PAHIT=S.pa||{};}catch(e){}
function save(){try{localStorage.setItem(LSK,JSON.stringify({ov:OV,pa:PAHIT}));}catch(e){}}
D.legs.forEach(function(l){if(l.done)LIVE[l.n]={h:l.done.h,a:l.done.a,st:'ft',clock:''};});

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function norm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ø/g,'o').toLowerCase();}
function pct(x,d){var f=Math.pow(10,d==null?1:d);return (Math.round(x*f)/f).toLocaleString('es-HN')+'%';}
function num(x,d){return Number(x).toLocaleString('es-HN',{minimumFractionDigits:d||0,maximumFractionDigits:d||0});}
function hn(iso){return new Date(iso).toLocaleTimeString('es-HN',{hour:'numeric',minute:'2-digit',timeZone:'America/Tegucigalpa'});}

/* Regla 1x2 con pago anticipado (PA): si el equipo elegido se pone 2 goles arriba, se da por ganada */
function evalLeg(l,m){
  if(!m||m.st==='pre')return{s:'p',t:'empieza '+hn(l.ko)};
  var diff=l.pick==='1'?m.h-m.a:l.pick==='2'?m.a-m.h:0;
  if(l.pa&&(PAHIT[l.n]||diff>=2)){return{s:'w',t:'va '+m.h+'-'+m.a+' · pago anticipado'};}
  var res=m.h>m.a?'1':m.h<m.a?'2':'X',ok=res===l.pick;
  if(m.st==='ft')return ok?{s:'w',t:'terminó '+m.h+'-'+m.a}:{s:'l',t:'terminó '+m.h+'-'+m.a};
  return{s:'p',t:'va '+m.h+'-'+m.a+(ok?' · cumpliendo':' · fallando')};
}
function legState(l){var a=evalLeg(l,LIVE[l.n]),o=OV[l.n];return{s:o||a.s,t:a.t,man:!!o};}

/* Simulador: cada selección pendiente gana con su probabilidad final */
function baseStates(){var b={};D.legs.forEach(function(l){b[l.n]=legState(l).s;});return b;}
function simNight(b){b=b||baseStates();var r={};D.legs.forEach(function(l){var st=b[l.n];r[l.n]=st==='w'?true:st==='l'?false:Math.random()*100<l.p;});return r;}
function runMany(n){var win=0,fails={},b=baseStates();D.legs.forEach(function(l){fails[l.n]=0;});
  for(var i=0;i<n;i++){var nt=simNight(b),all=true;D.legs.forEach(function(l){if(!nt[l.n]){all=false;fails[l.n]++;}});if(all)win++;}
  return{n:n,win:win,fails:fails};}

function stack2(book,model){return '<div class="x3"><span class="lb">Casa (cuota)</span>'+bar(book)+'<span class="lb">Mi análisis</span>'+bar(model)+'</div>';}
function bar(v){return '<div class="meter" style="grid-column:auto;height:16px;border-radius:4px;position:relative"><i style="width:'+v+'%"></i><span style="position:absolute;inset:0;font:600 11px/16px var(--body);padding-left:6px;color:var(--ink)">'+pct(v,0)+'</span></div>';}

function render(){
  var sts=D.legs.map(legState),w=0,l=0;sts.forEach(function(s){if(s.s==='w')w++;if(s.s==='l')l++;});
  var tot=D.legs.length,st=l?'l':w===tot?'w':'p';
  var live=1;D.legs.forEach(function(x,i){if(sts[i].s==='l')live=0;else if(sts[i].s!=='w')live*=x.p/100;});
  var h='<header class="card"><div class="row"><div><div class="lbl">Múltiple · 11 selecciones · ID '+esc(D.id)+'</div><h1>Boleto de 11 partidos</h1></div><span class="chip '+st+'">'+{p:'En juego',w:'¡Ganado!',l:'Perdido'}[st]+'</span></div>';
  h+='<div class="kpis"><div><span class="lbl">Cuota total</span><b>'+num(D.odds_total,2)+'</b><small>Apuesta L '+num(D.stake,2)+'</small></div><div><span class="lbl">Ganancia total</span><b>L&nbsp;'+num(D.win,2)+'</b><small>Hecho el '+esc(D.placed)+'</small></div></div>';
  h+='<div class="kpis"><div class="'+(live<0.01?'bad':'')+'"><span class="lbl">Probabilidad de ganar ahora</span><b>'+(live===0?'0%':'1 en '+num(Math.round(1/live)))+'</b><small>'+(live===0?'Ya se cayó una selección':pct(live*100,live<0.01?3:1)+' con lo que falta')+'</small></div><div><span class="lbl">Selecciones</span><b>'+w+' ✓ · '+l+' ✕</b><small>'+(tot-w-l)+' pendientes</small></div></div>';
  h+='<div class="bar" aria-hidden="true"><i class="w" style="width:'+(w/tot*100)+'%"></i><i class="l" style="width:'+(l/tot*100)+'%"></i></div>';
  h+='<div class="row muted"><span>'+esc(SRC)+'</span>'+(IS_GH?'<button class="link" id="refresh" type="button">Actualizar ahora</button>':'')+'</div></header>';

  /* lectura rápida */
  var srt=D.legs.filter(function(x){return !x.done;}).slice().sort(function(a,b){return a.p-b.p;});
  h+='<section class="card"><h2>Lo que dice el análisis</h2><p class="muted">Al hacer el boleto, las probabilidades daban <b>1 en '+num(Math.round(1/D.prob))+'</b>. La casa paga '+num(D.odds_total,0)+' veces, así que el precio está cerca de lo justo, pero sigue siendo muy difícil.</p>';
  h+='<ul class="rank">';srt.forEach(function(x){var nm=x.pick==='1'?x.home:x.away;
    h+='<li><span>'+esc(nm)+' gana <span class="muted">('+esc(x.home)+' vs '+esc(x.away)+')</span></span><b>'+pct(x.p,0)+'</b><span class="meter"><i style="width:'+x.p+'%"></i></span></li>';});
  h+='</ul><p class="muted">Las selecciones que más pueden tumbar el boleto son Mauritania Sub-20 y Guinea-Bissau Sub-20. Las 4 con <b>PA</b> (pago anticipado) se dan por ganadas si el equipo se pone 2 goles arriba; eso les suma entre 1.5 y 3 puntos.</p></section>';

  /* viaje al futuro */
  h+='<section class="card" id="futuro"><h2>Viaje al futuro</h2><p class="muted">Simula cómo podría terminar el día con las probabilidades de cada selección. Lo que ya terminó cuenta tal cual.</p><div class="btns"><button class="btn" id="sim1" type="button">Simular el día</button><button class="btn sec" id="simN" type="button">Simular 100,000 días</button></div>';
  if(NIGHT){var ok=D.legs.every(function(x){return NIGHT[x.n];});
    h+='<div class="simlist">';D.legs.forEach(function(x){var nm=x.pick==='1'?x.home:x.away;h+='<div class="simrow"><span>'+esc(nm)+' gana</span><span class="'+(NIGHT[x.n]?'ok':'no')+'">'+(NIGHT[x.n]?'Sí':'No')+'</span></div>';});
    h+='</div><p class="'+(ok?'ok':'no')+'">'+(ok?'En esta simulación el boleto GANA':'En esta simulación el boleto pierde')+'</p>';}
  if(MANY){h+='<h3>'+num(MANY.win)+' boletos ganados de '+num(MANY.n)+' días ('+pct(MANY.win/MANY.n*100,3)+')</h3><div class="hits">';
    D.legs.slice().sort(function(a,b){return MANY.fails[b.n]-MANY.fails[a.n];}).forEach(function(x){var r=MANY.fails[x.n]/MANY.n*100,nm=x.pick==='1'?x.home:x.away;
      h+='<div class="hit"><span>Falló '+esc(nm)+'</span><b>'+pct(r,0)+' de los días</b><span class="meter"><i style="width:'+r+'%;background:var(--lose)"></i></span></div>';});
    h+='</div>';}
  h+='</section>';

  /* selecciones */
  h+='<h2>Selección por selección</h2>';
  D.legs.forEach(function(x,i){var m=LIVE[x.n],s=sts[i],ico=s.s==='w'?'✓':s.s==='l'?'✕':'',nm=x.pick==='1'?x.home:x.away;
    var lv=!m||m.st==='pre'?'<span class="live ft">'+esc(hn(x.ko))+' (Honduras)</span>':m.st==='ft'?'<span class="live ft">Final</span>':m.st==='ht'?'<span class="live">Medio tiempo</span>':'<span class="live">En vivo '+esc(m.clock||'')+'</span>';
    h+='<article class="match '+s.s+'"><div class="mh"><div class="row"><span class="teams"><span class="num">'+String(x.n).padStart(2,'0')+'</span>'+esc(x.home)+' vs '+esc(x.away)+'</span><span class="lbl">'+esc(x.comp)+'</span></div>';
    h+='<div class="score"><span class="sc">'+(m&&m.st!=='pre'?m.h+' – '+m.a:'– : –')+'</span>'+lv+(x.espn||x.done?'':'<span>sin datos en vivo: márcala tú</span>')+'</div></div>';
    h+='<button class="sel '+s.s+'" data-ov="'+x.n+'" id="b-'+x.n+'" type="button"><span class="dot" aria-hidden="true">'+ico+'</span><span class="lt"><span>1x2 · '+x.pick+(x.pa?'<span class="pa">PA</span>':'')+'</span><b>Gana '+esc(nm)+'</b></span><span class="lp"><span class="oddsv">'+num(x.odds,2)+'</span><span>'+esc(s.t)+(s.man?' · manual':'')+'</span></span></button>';
    h+='<div class="an">'+(x.done?'':stack2(x.p_book,x.p_model)+'<p class="muted">Probabilidad final: <b>'+pct(x.p)+'</b>'+(x.boost?' (incluye +'+num(x.boost,1)+' por pago anticipado)':'')+'</p>');
    h+='<div><div class="lbl">Datos</div><ul class="facts">'+x.facts.map(function(f){return '<li>'+esc(f)+'</li>';}).join('')+'</ul></div></div></article>';});
  h+='<p class="muted">Toca una selección para marcarla a mano: ganada → perdida → automática. "Casa" es la probabilidad que da la cuota quitando el margen de la casa (~7%). Esto es un cálculo, no una garantía.</p>';
  document.getElementById('app').innerHTML=h;
}

async function getJSON(u){var r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(r.status);return r.json();}
function tt(c){var t=(c&&c.team)||{};return norm([t.displayName,t.name,t.shortDisplayName,t.location,t.abbreviation].join(' '));}
async function refresh(){
  var lg={};D.legs.forEach(function(l){if(l.espn&&!l.done)(lg[l.espn]=lg[l.espn]||[]).push(l);});var ok=0;
  await Promise.all(Object.keys(lg).map(async function(code){
    var sb;try{sb=await getJSON('https://site.api.espn.com/apis/site/v2/sports/soccer/'+code+'/scoreboard?dates='+D.date);ok++;}catch(e){return;}
    (lg[code]).forEach(function(l){
      var ev=(sb.events||[]).find(function(e){var cs=(e.competitions&&e.competitions[0]&&e.competitions[0].competitors)||[];
        return cs.some(function(c){return l.qh.some(function(q){return tt(c).indexOf(q)>=0;});})&&cs.some(function(c){return l.qa.some(function(q){return tt(c).indexOf(q)>=0;});});});
      if(!ev)return;var comp=ev.competitions[0],hm=comp.competitors.find(function(c){return c.homeAway==='home';})||comp.competitors[0],aw=comp.competitors.find(function(c){return c.homeAway==='away';})||comp.competitors[1];
      var ty=(ev.status&&ev.status.type)||{},st=ty.state==='post'?'ft':ty.state==='in'?(/HALFTIME|HALF_TIME/i.test(ty.name||'')?'ht':'live'):'pre';
      var hh=l.qh.some(function(q){return tt(hm).indexOf(q)>=0;}),sh=Number(hm.score)||0,sa=Number(aw.score)||0;
      var m={h:hh?sh:sa,a:hh?sa:sh,st:st,clock:(ev.status&&ev.status.displayClock)||''};LIVE[l.n]=m;
      var diff=l.pick==='1'?m.h-m.a:m.a-m.h;if(l.pa&&st!=='pre'&&diff>=2&&!PAHIT[l.n]){PAHIT[l.n]=true;save();}
    });
  }));
  SRC=ok?'Marcadores en vivo de ESPN · '+new Date().toLocaleTimeString('es-HN',{hour:'numeric',minute:'2-digit'}):(IS_GH?'No se pudieron leer los marcadores. Reintentando…':'Los marcadores en vivo funcionan en la página de GitHub.');
  render();
}
document.getElementById('app').addEventListener('click',function(e){
  if(e.target.closest('#refresh')){SRC='Actualizando…';render();refresh();return;}
  if(e.target.closest('#sim1')){NIGHT=simNight();render();var a=document.getElementById('futuro');if(a)a.scrollIntoView({block:'start'});return;}
  if(e.target.closest('#simN')){MANY=runMany(100000);render();var b=document.getElementById('futuro');if(b)b.scrollIntoView({block:'start'});return;}
  var t=e.target.closest('[data-ov]');if(!t)return;var id=t.dataset.ov,cur=OV[id];
  if(!cur)OV[id]='w';else if(cur==='w')OV[id]='l';else delete OV[id];save();render();var nb=document.getElementById('b-'+id);if(nb)nb.focus();
});
SRC=IS_GH?'Cargando marcadores…':'Los marcadores en vivo funcionan en la página de GitHub.';
render();if(IS_GH){refresh();setInterval(refresh,60000);}
})();
</script>
